services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce_tracking_guard
      POSTGRES_USER: ecommerce_tracking_guard
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - '55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ecommerce_tracking_guard -d ecommerce_tracking_guard',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
